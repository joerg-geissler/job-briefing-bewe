name: Job Briefing – Dashboard aktualisieren

# Mail-Abruf, Auswertung und Telegram laufen seit 06.10.2026 im n8n-Workflow
# "Job-Briefing" auf der NAS. n8n committet jobs_dashboard.json; dieser Workflow
# baut daraus nur noch die GitHub-Pages-Seite (index.html) neu.
on:
  push:
    branches: [master]
    paths: [jobs_dashboard.json]
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  dashboard:
    runs-on: ubuntu-latest
    permissions:
      contents: write        # fuer git commit + push

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python 3.11 einrichten
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Dashboard-HTML generieren (generate.py)
        env:
          CLOUD: '1'
          TZ: Europe/Berlin
        run: python generate.py

      # Push mit GITHUB_TOKEN loest keinen neuen Workflow-Lauf aus -> keine Schleife
      - name: Aenderungen committen
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --staged --quiet && echo "Keine Aenderungen." || \
            git commit -m "dashboard $(date +%Y-%m-%d)"
          git push
